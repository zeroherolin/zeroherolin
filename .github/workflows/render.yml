name: render

on:
  schedule:
    - cron: "0 19 * * *"  # 03:00 China Standard Time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render.py
      - assets/icons/**
      - .github/workflows/render.yml

permissions: {}

concurrency:
  group: render
  cancel-in-progress: false  # a render is never stopped halfway through publishing; the next one waits

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # push README.md to main and the images to output
      actions: write   # re-enable this workflow (keep-alive)
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BOT_NAME: github-actions[bot]
      BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Render images and README
        run: python3 scripts/render.py

      - name: Publish images to the output branch
        # One commit, replaced on each change, so the images never pile up history.
        # Before the README, so the README never links to an image that is not there yet.
        run: |
          cd build
          git init -q -b output
          git add -A
          git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" commit -q -m "Rendered images"
          url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 "$url" output 2>/dev/null &&
             [ "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git rev-parse 'HEAD^{tree}')" ]; then
            echo "Images unchanged"
            exit 0
          fi
          for attempt in 1 2 3; do
            git push -q -f "$url" HEAD:output && exit 0
            sleep $((attempt * 5))
          done
          echo "::error::could not publish the images"
          exit 1

      - name: Commit README if changed
        # Last: README.md records which repositories it was generated from, so a run that
        # fails before this point leaves a record that no longer matches, and watch.yml
        # dispatches this workflow again.
        run: |
          git add README.md
          if git diff --cached --quiet; then
            echo "README unchanged"
            exit 0
          fi
          git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" commit -q -m "Update README"
          for attempt in 1 2 3; do
            git push -q && exit 0
            git -c user.name="$BOT_NAME" -c user.email="$BOT_EMAIL" pull --rebase -q || break
          done
          echo "::error::could not push README.md"
          exit 1

      - name: Keep the schedules alive
        # GitHub disables scheduled workflows after 60 days without repository activity.
        if: github.event_name != 'push'
        run: |
          for workflow in render.yml watch.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
          done
        env:
          GH_TOKEN: ${{ github.token }}
